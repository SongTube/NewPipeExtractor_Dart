group 'com.artxdev.newpipeextractor_dart'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

// NewPipeExtractor is only published on JitPack, and the consuming app resolves
// this plugin's transitive dependencies against *its own* repository list. A
// plain `allprojects` block here covers only this project, so the app build
// fails with "Could not find com.github.TeamNewPipe:NewPipeExtractor". Register
// the repository on every project in the build instead.
//
// Apps that lock repositories down with
// `repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)` must add
// `maven { url = uri("https://jitpack.io") }` to their own settings.gradle.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.artxdev.newpipeextractor_dart'

    compileSdk 36

    defaultConfig {
        minSdk 24
        // Applied to the consuming app's R8 run, so release builds work without
        // the app having to know about Rhino/protobuf.
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        // NewPipeExtractor and this plugin use java.time, which is API 26+ natively.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Don't fail a consumer's build over lint findings in this library.
        abortOnError false
    }

    testOptions {
        unitTests.all {
            it.testLogging {
                events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.preference:preference:1.2.1'

    // Pulls jsoup / rhino / nanojson / protobuf-javalite in transitively at the
    // versions it was built against. Do not pin those separately -- stale pins
    // silently break extraction at runtime.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.4'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
}
