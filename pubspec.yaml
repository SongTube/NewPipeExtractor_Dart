name: newpipeextractor_dart
description: Flutter bindings for the NewPipe Extractor library, exposing YouTube
    video, playlist, channel, search, comment and trending extraction to Dart.
publish_to: none
version: 0.1.0
homepage:

environment:
    sdk: ">=3.5.0 <4.0.0"
    flutter: ">=3.24.0"

dependencies:
    flutter:
        sdk: flutter
    http: ^1.6.0
    html: ^0.15.6
    flutter_inappwebview: ^6.1.5

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
    # This section identifies this Flutter project as a plugin project.
    # The 'pluginClass' and Android 'package' identifiers should not ordinarily
    # be modified. They are used by the tooling to maintain consistency when
    # adding or updating assets for this project.
    plugin:
        platforms:
            android:
                package: com.artxdev.newpipeextractor_dart
                pluginClass: NewpipeextractorDartPlugin
